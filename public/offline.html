<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)" />
    <title>ไม่มีการเชื่อมต่อ · ตู้เซฟ</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f8fa; --text: #182132; --muted: #667085; --accent: #2f6fed; }
      @media (prefers-color-scheme: dark) { :root { --bg: #101318; --text: #e9edf5; --muted: #9ca7b7; --accent: #6694f4; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans Thai", system-ui, sans-serif; text-align: center; }
      svg { display: block; margin: 0 auto; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; max-width: 320px; }
      a { display: inline-block; padding: 10px 20px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" aria-hidden="true" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#2F6FED"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="14.5" width="14" height="10" rx="2"/><path d="M12 14.5v-3a4 4 0 0 1 8 0v3"/></g></svg>
      <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>ตู้เซฟต้องเชื่อมต่อเพื่อโหลดแอปเวอร์ชันล่าสุดและซิงก์ข้อมูล ตรวจการเชื่อมต่อแล้วลองใหม่อีกครั้ง</p>
      <a href="/">ลองใหม่</a>
    </main>
  </body>
</html>
